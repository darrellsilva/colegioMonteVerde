<button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#exampleModal">
  Agregar Ingreso Extra
</button>

<div class="accordion accordion-flush" id="accordionFlushExample">
  <div class="accordion-item">
    <h2 class="accordion-header" id="flush-headingOne">
      <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseOne" aria-expanded="false" aria-controls="flush-collapseOne">
        Otros Ingresos
      </button>
    </h2>
    <div id="flush-collapseOne" class="accordion-collapse collapse" aria-labelledby="flush-headingOne" data-bs-parent="#accordionFlushExample">
      <table class="table">
        <thead>
        <tr>
          <th scope="col">Ingreso</th>
          <th scope="col">Monto</th>
          <th scope="col"></th>
        </tr>
        </thead>
        <tbody>
          @for (ingresos of listOtrosIngresos; track ingresos.id) {
            <tr>
              <td>{{ ingresos.descripcionIngreso }}</td>
              <td>$ {{ ingresos.montoIngreso }}</td>
              <td>
                <button type="button" class="btn btn-danger" (click)="eliminarIngreso(ingresos.id)">Eliminar</button>
            </tr>
          }
        </tbody>
      </table>    </div>
  </div>
</div>


<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Ingrese otro gasto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="formOtrosIngresos">
          <div class="mb-3">
            <label for="descripcionIngreso" class="form-label">Descripcion de ingreso</label>
            <input type="text" class="form-control" id="descripcionIngreso" formControlName="descripcionIngreso" placeholder="Ej. Completada">
          </div>
          <div class="mb-3">
            <label for="montoIngreso" class="form-label">Monto Ingreso</label>
            <input type="text" class="form-control" id="montoIngreso" formControlName="montoIngreso" placeholder="50.000">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" class="btn btn-primary" [disabled]="!formOtrosIngresos.valid" (click)="registraIngresoExtra()">Guardar Ingreso</button>
      </div>
    </div>
  </div>
</div>
